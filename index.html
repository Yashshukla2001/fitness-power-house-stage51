   // Force every reload/back-forward navigation to start at the top of
      // the page. Must run here (inline, in <head>) rather than in
      // main.tsx — the browser's own scroll-restoration decision happens
      // before any module script has a chance to load, so anything in
      // main.tsx would run too late to prevent the initial restored jump.
      if ('scrollRestoration' in window.history) {
        window.history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);
